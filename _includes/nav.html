<nav class="site-nav">
  <ul class="nav">
  {%- for item in site.data.navigation.main -%}
    <li class="nav-item">
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {%- if item.children -%}
        <ul class="nav-sub">
        {%- for c in item.children -%}
          <li><a href="{{ c.url | relative_url }}">{{ c.title }}</a></li>
        {%- endfor -%}
        </ul>
      {%- endif -%}
    </li>
  {%- endfor -%}
  </ul>
</nav>
<style>
.nav{list-style:none;margin:0;padding:0;display:flex;gap:1rem;flex-wrap:wrap}
.nav-sub{list-style:none;margin:.25rem 0 0 0;padding-left:1rem}
.nav a{text-decoration:none}
</style>
